# ==========================================
# APPLICATION
# ==========================================

spring.application.name=CRM


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==========================================
# JWT
# ==========================================

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=300000000


# ==========================================
# THYMELEAF MAIL TEMPLATE
# ==========================================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false


# ==========================================
# SCHEDULERS
# ==========================================

crm.followup.scheduler.cron=0 30 09 * * MON-SAT
crm.notification.cleanup.cron=0 0 2 * * *
crm.resignation.scheduler.cron=0 0 1 * * *


# ==========================================
# AI SERVICE
# ==========================================

ai.service.api-key=${AI_SERVICE_API_KEY}
ai.service.base-url=${AI_SERVICE_BASE_URL}


# ==========================================
# EMAIL SERVICE
# ==========================================

email.service.api-key=${EMAIL_SERVICE_API_KEY}
email.service.base-url=${EMAIL_SERVICE_BASE_URL}