# ==========================================
# APPLICATION
# ==========================================
spring.application.name=CRM

# ==========================================
# DATABASE (Supports DB_URL or DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_USERNAME)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_crm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# JWT (256-bit Base64-encoded Secret)
# ==========================================
spring.app.jwtSecret=${JWT_SECRET:c2VjdXJlSldUU2VjcmV0S2V5Rm9yQ1JNU3lzdGVtMjAyNiExMjM0NTY=}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# SPRING MAIL
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}

# ==========================================
# THYMELEAF MAIL TEMPLATE
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ==========================================
# SCHEDULERS
# ==========================================
crm.followup.scheduler.cron=${CRM_FOLLOWUP_CRON:0 30 09 * * MON-SAT}
crm.notification.cleanup.cron=${CRM_NOTIFICATION_CLEANUP_CRON:0 0 2 * * *}
crm.resignation.scheduler.cron=${CRM_RESIGNATION_CRON:0 0 1 * * *}

# ==========================================
# MICROSERVICES (Email & AI Services)
# ==========================================
email.service.base-url=${EMAIL_SERVICE_BASE_URL:http://localhost:5140}
email.service.api-key=${EMAIL_SERVICE_API_KEY:default_internal_email_key}
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:default_internal_ai_key}
